name: Publish tracker and check announcements
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      line_test:
        description: Send one LINE test message to the configured personal recipient
        type: boolean
        default: false
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test persistence and forecast rules
        run: node --test tests/*.test.cjs
      - name: Test announcement parsing
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/cache@v4
        with:
          path: public/data/announcements.json
          key: announcements-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: announcements-v1-
      - name: Check official announcement pages
        timeout-minutes: 5
        env:
          SITE_MONITOR_URL: https://exam-path-personal-2026-r.rat-creative1.chatgpt.site/api/official-source
          SITE_MONITOR_ACCESS: ${{ secrets.SITE_MONITOR_ACCESS }}
        run: python scripts/refresh.py
      - name: Save public feed for LINE notifications
        uses: actions/upload-artifact@v4
        with:
          name: notification-feed
          path: public/data/announcements.json
          retention-days: 7
      - name: Install browser test runtime
        run: npm install --no-save --ignore-scripts playwright@1.62.1
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test browser persistence, documents, and mobile layout
        run: |
          node scripts/browser-check.cjs
          node scripts/sync-browser-check.cjs
      - name: Save browser verification images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: reports
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  notify-line:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: notification-feed
          path: public/data
      - uses: actions/cache/restore@v4
        with:
          path: .line-notification-state.json
          key: line-notifications-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: line-notifications-v1-
      - name: Notify personal LINE chat after publication
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_RECIPIENT_ID: ${{ secrets.LINE_RECIPIENT_ID }}
          LINE_SEND_TEST: ${{ inputs.line_test && 'true' || 'false' }}
        run: python scripts/notify_line.py
      - name: Preserve accepted alerts even if a later send fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .line-notification-state.json
          key: line-notifications-v1-${{ github.run_id }}-${{ github.run_attempt }}



